<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Daddy - Admin PDF Upload</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="../assets/css/navigation.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script>
    (function () {
      try {
        const theme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="../index.html" class="logo" aria-label="College Daddy Home">
        <i class="fas fa-graduation-cap"></i>
        <span>College Daddy</span>
      </a>
      <div class="nav-actions">
        <button class="menu-button" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
      </div>
      <nav class="nav-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="cgpa.html" class="nav-link">CGPA Calculator</a>
        <a href="iacal.html" class="nav-link">IA Calculator</a>
        <a href="pomodoro.html" class="nav-link">Study Timer</a>
        <a href="notes.html" class="nav-link active">Notes</a>
        <a href="roadmap.html" class="nav-link">Roadmap</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="project-architect.html" class="nav-link">Architect</a>
        <button class="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
          <span class="theme-icon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-container">
      <h1>Admin PDF Upload</h1>
      <form id="uploadForm" class="admin-form" enctype="multipart/form-data" method="POST" action="/api/admin/upload">
        <div class="form-field">
          <label for="semester">Semester:</label>
          <select id="semester" name="semester" required></select>
        </div>
        <div class="form-field">
          <label for="branch">Branch:</label>
          <select id="branch" name="branch" required></select>
        </div>
        <div class="form-field full-span">
          <label for="subject">Subject:</label>
          <select id="subject" name="subject" required></select>
        </div>
        <div class="form-field full-span">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required>
        </div>
        <div class="form-field full-span">
          <label for="description">Description (Optional):</label>
          <input type="text" id="description" name="description">
        </div>
        <div class="form-field full-span">
          <label for="pdf">Document File:</label>
          <input type="file" id="pdf" name="pdf" accept=".pdf,.docx,.doc,.txt,.pptx,.ppt" required>
          <small class="file-note">Supported: PDF, DOCX, DOC, TXT, PPTX, PPT (auto-converts to PDF)</small>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>

      <div id="result" role="status" aria-live="polite"></div>

      <section class="materials-list" id="materialsList" aria-live="polite">
        <h2>Latest Materials for Selected Subject</h2>
        <div id="materials"></div>
      </section>

      <a href="notes.html" class="back-link">&larr; Back to Notes</a>
    </div>
  </main>

  <script src="../assets/js/components/navigation.js"></script>
  <script src="../assets/js/components/footer.js"></script>
  <script src="../assets/js/pages/admin.js"></script>
  
<!-- Back to Top Button -->
<button id="backToTopBtn" title="Back to Top">↑</button>
<link rel="stylesheet" href="../assets/css/back-to-top.css">
<script src="../assets/js/back-to-top.js"></script>
<!-- Back to Top Button -->
<button id="backToTopBtn" title="Back to Top">↑</button>
<link rel="stylesheet" href="../assets/css/back-to-top.css">
<script src="../assets/js/back-to-top.js"></script>
</body>
</html>
